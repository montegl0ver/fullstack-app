name: Deploy Full-Stack App to DigitalOcean

on:
  push:
    branches:
      - main  # Если твоя ветка называется master, замени main на master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/fullstack-app
            cd ~/fullstack-app
            
            # Проверяем репозиторий и обновляем код
            if [ -d ".git" ]; then
              git pull origin main
            else
              rm -rf * .[!.]*
              git clone https://github.com/montegl0ver/fullstack-app.git .
            fi
            
            # Жесткая очистка конфликтующих контейнеров
            docker-compose down --remove-orphans || true
            docker rm -f fullstack-app_nginx_1 || true
            
            # Чистая сборка и запуск бэкенда, фронтенда и Nginx
            docker-compose up --build -d